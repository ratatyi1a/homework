<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>info</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <nav class="header__nav">
            <ul class="header__nav-list">
                <li class="header__nav-item">Home</li>
                <li class="header__nav-item">About</li>
                <li class="header__nav-item">Services</li>
                <li class="header__nav-item">Contact</li>
            </ul>
        </nav>
        <button class="header__button header__button--login">Login</button>
    </header>
    <main class="content">
        <section class="content__hero">
            <h1 class="content__title">Добро пожаловать</h1>
            <p class="content__text">Наш сайт помогает изучать историю.</p>
            <button class="content__button content__button--primary">Узнать больше</button>
        </section>
        <section class="content__cards">
            <div class="card">
                <h2 class="card__title">Китай</h2>
                <p class="card__text">Древний китайский народ.</p>
            </div>
            <div class="card card--accent">
                <h2 class="card__title">США</h2>
                <p class="card__text">Гражданская война (1861–1865)</p>
            </div>
            <div class="card">
                <h2 class="card__title">Маврикий</h2>
                <p class="card__text">Захват французами в 1715 году.</p>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p class="footer__text"> 2026 Company все права защищены.</p>
        <ul class="footer__social">
            <li class="footer__social-item">VK</li>
            <li class="footer__social-item">Telegram</li>
            <li class="footer__social-item">YouTube</li>
        </ul>
    </footer>
</body>
</html>
