<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Документ</title>
    <link rel="stylesheet" href="2204.css">
</head>
<body>
<input type="text" class="input" placeholder="Введите текст">
<button class="button">Нажми меня</button>
<ul>
    <li class="list-item">Пункт 1</li>
    <li class="list-item">Пункт 2</li>
    <li class="list-item">Пункт 3</li>
    </ul>
    <div class="div">
        <p class="div-text">Это текст внутри div</p>
        <p class="div-text">Еще один абзац внутри div</p>
        <h2 class="div-text">Заголовок внутри div</h2>
        <a class="div-text link" href="https://ru.wikipedia.org/wiki/%D0%9A%D0%B8%D1%82%D0%B0%D0%B9">Китай1</a>
    </div>
<div class="cont">
    <p class="cont">Наведи</p>
    <p class="cont">Еще один абзац внутри второго div</p>
    <h2 class="cont">Заголовок внутри второго div</h2>
    <input class="cont" type="text" placeholder="Введите текст">
</div>

</body>
</html>
