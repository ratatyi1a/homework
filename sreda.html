<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Form</title>
 </head>
    <body>
<fieldset>
        <legend>Личная информация</legend>
<form action="18;03.html" method="post">
    <label for="name">Введите имя:</label>
    <input type="text" id="name" name="name">

<p><form action="18;03.html" method="post"></form></p> 
    <label for="email">Введите почту:</label>
    <input type="email" id="email" name="email">

<p><form action="18;03.html" method="post"></form></p>
    <label for="password">Введите пароль:</label>
    <input type="password" id="password" name="password">

 <p><label for="country">Выберите свою страну:</label></p>
    <select id="country" name="country" required>
    <option value="us">США</option>
    <option value="ca">Россия</option>
    <option value="uk">Канада</option>
    <option value="au">Казахстан</option>
</select>
<p><button type="submit">Отправить</button></p>
<button type="reset">Сбросить</button>
</fieldset>
</form>

    </body>
</html>
