<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Example</title>
</head>

<body>
    <div style="position: relative; width: 300px; height: 2000px; background-color: lightblue;">
        <div style="position: static; width: 175px; height: 110px; background-color: lightcoral;">
            <!-- Обычное положение элемента в потоке документа -->
            Static Positioned Box
        </div>
        <div style="position: relative; top: 20px; left: 50px; width: 175px; height: 110px; background-color: lightgreen;">
            <!-- Смещается относительно своего обычного положения -->
            Relative Positioned Box
        </div>
        <div style="position: absolute; top: 100px; left: 250px; width: 175px; height: 110px; background-color: lightyellow;">
            <!-- Позиционируется относительно родителя с position: relative -->
            Absolute Positioned Box
        </div>
        <div style="position: sticky; top: 10px; width: 175px; height: 110px; background-color: lightgray;">
            <!-- При прокрутке страницы остаётся видимым в пределах родителя -->
            Sticky Positioned Box
        </div>
        <div style="position: fixed; bottom: 20px; right: 20px; width: 175px; height: 110px; background-color: lightpink;">
            <!-- Закреплён на экране и не двигается при прокрутке -->
            Fixed Positioned Box
        </div>
        <img src="https://cdn.domdivanov.kz/files/imgs/ig1111915/kuhonnyi-razdvizhnoi-stol-singapur-tip-1-chernyi-muarsteklo-belyi-mramor-2-2000x1460.jpg"
            alt="Image" style="width: 350px; height: 2000px;">
    </div>

</body>
</html>
