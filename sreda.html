<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Form</title>
 </head>
    <body>

<form action="18;03.html" method="post">
    <fieldset>
        <legend>Личная информация</legend>
    <!-- филдсет создаёт рамку вокруг нужных элементов, а легенд даёт этой рамке название -->
    <p><label for="name">Введите имя:</label></p>
    <input type="text" id="name" name="name">
    <!-- поле для ввода имени -->

    <p><label for="email">Введите почту:</label></p>
    <input type="email" id="email" name="email">
<!-- поле для ввода почты -->
    <p><label for="password">Введите пароль:</label></p>
    <input type="password" id="password" name="password">
    <!-- поле для ввода пароля -->
    <p>
    <label for="comment">Введите комментарий:</label></p>
    <textarea id="comment" name="comment" rows="4" cols="30"></textarea>
    <!-- поле для ввода многострочного комментария -->

    </p>

  <p><label for="country">Выберите свою страну:</label></p> 
    <select id="country" name="country" required>
    <option value="us">США</option>
    <option value="ru">Россия</option>
    <option value="ca">Канада</option>
    <option value="kz">Казахстан</option>
</select>
<!-- выпадающий список для выбора страны -->
<p><button type="submit">Отправить</button></p>
<!-- кнопка для отправки формы -->
<button type="reset">Сбросить</button>
<!-- кнопка для очистки всех полей в группе -->
</fieldset>
</form>

    </body>
</html>
